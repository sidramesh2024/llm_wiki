services:
  neo4j:
    image: neo4j:5.26-community
    container_name: llmwiki-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-llmwiki1}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "llmwiki1", "RETURN 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  neo4j_data:
